<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de QR Personalizado</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.6.0-rc.1"></script>
</head>

<body>
    <div class="container">
        <!-- Panel Izquierdo: Controles -->
        <div class="card controls-panel">
            <h3>Generador de QR</h3>
            <p class="subtitle">Personaliza y descarga tu código. <span class="mobile-hint">Abajo podrás encontrar una previsualización de tu QR.</span></p>

            <div class="input-group">
                <label>URL o Contenido</label>
                <input type="text" id="url_qr" value="https://arturomaldonado.space">
            </div>

            <div class="row">
                <div class="input-group half">
                    <label>Forma de los puntos</label>
                    <select id="dots_shape">
                        <option value="square">Cuadrados</option>
                        <option value="dots">Puntos</option>
                        <option value="rounded" selected>Redondeados</option>
                        <option value="extra-rounded">Extra Redondos</option>
                        <option value="classy">Elegantes</option>
                        <option value="classy-rounded">Elegantes Redondos</option>
                    </select>
                </div>

                <div class="input-group half">
                    <label>Forma Marcador (Exterior)</label>
                    <select id="corners_shape">
                        <option value="square" selected>Cuadrados</option>
                        <option value="dot">Puntos</option>
                        <option value="rounded">Redondeados</option>
                        <option value="extra-rounded">Extra Redondos</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Forma Marcador (Interior)</label>
                <select id="corners_dot_shape">
                    <option value="square" selected>Cuadrados</option>
                    <option value="dot">Puntos</option>
                    <option value="rounded">Redondeados</option>
                    <option value="extra-rounded">Extra Redondos</option>
                </select>
            </div>

            <div class="row">
                <div class="input-group half">
                    <label>Color QR 1 (Gradiente)</label>
                    <input type="color" id="color_qr_1" value="#4a7ede">
                </div>
                <div class="input-group half">
                    <label>Color QR 2 (Gradiente)</label>
                    <input type="color" id="color_qr_2" value="#000000">
                </div>
            </div>

            <div class="row">
                <div class="input-group half">
                    <label>Fondo Sólido</label>
                    <input type="color" id="bg_color" value="#ffffff">
                </div>
                <div class="input-group half">
                    <label>Resolución (px)</label>
                    <input type="number" id="qr_size" value="1000" min="100" max="4000">
                </div>
            </div>

            <button id="btnDescargar">Descargar Imagen QR</button>
        </div>

        <!-- Panel Derecho: Previsualización -->
        <div class="card preview-panel">
            <h3>Previsualización</h3>
            <p class="subtitle">En tiempo real</p>
            <div id="canvas-container" class="canvas-wrapper">
                <div id="canvas"></div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
